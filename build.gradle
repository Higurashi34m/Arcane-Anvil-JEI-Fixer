// Plugins
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

// Project
base.archivesName = "${mod_id}-neo"
version           = "${minecraft_version}+${mod_version}"
group             = mod_group_id

// NeoForge
neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.mapping_mc_version
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')

            jvmArguments.addAll([
                    '-Xmx4G', '-Xms1G',
                    '-XX:+UseG1GC',
                    '-XX:+ParallelRefProcEnabled',
                    '-XX:MaxGCPauseMillis=80',
                    '-XX:+UnlockExperimentalVMOptions',
                    '-XX:G1NewSizePercent=20',
                    '-XX:G1MaxNewSizePercent=40',
                    '-XX:G1HeapRegionSize=8M',
                    '-XX:G1ReservePercent=20',
                    '-XX:InitiatingHeapOccupancyPercent=15',
                    '-XX:+UseStringDeduplication',
                    '-XX:+AllowEnhancedClassRedefinition'
            ])

            systemProperty 'forge.logging.markers'             , 'REGISTRIES'
            systemProperty 'forge.logging.console.level'       , 'debug'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client {
            client()
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll([
                    '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    //'--existing-mod', "need to runData modId"
            ])
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
        }
    }

    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Repositories
repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = "CurseMaven"
        url  = "https://cursemaven.com"
    }

    maven {
        name = "JEI"
        url  = "https://maven.blamejared.com/"
    }

    maven {
        name = "Iron's Maven"
        url  = "https://code.redspace.io/releases"
    }

    maven {
        name = "GeckoLib"
        url  = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven"
    }

    maven {
        name = "Curios API"
        url  = "https://maven.theillusivec4.top"
    }

    maven {
        name = "Player Animator"
        url  = "https://maven.kosmx.dev"
    }
}

dependencies {
    // JEI
    compileOnly libs.jei.api
    runtimeOnly libs.jei

    // Jade
    runtimeOnly libs.jade

    // Iron's Spells'n Spellbooks
    implementation libs.ironsSpellbooks

    // GeckoLib
    implementation libs.geckoLib

    // Curios API
    implementation libs.curiosAPI

    // Player Animator
    implementation libs.playerAnimator

    def isRunData   = gradle.startParameter.taskNames.contains('runData')
    def isRunServer = gradle.startParameter.taskNames.contains('runServer')

    if (!isRunData) {
        runtimeOnly libs.bundles.optimization

        if (!isRunServer) {
            runtimeOnly libs.bundles.utility
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var properties = [
            // Minecraft
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,

            // NeoForge
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,

            // Mod
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_license            : mod_license,
            mod_description        : mod_description,
            mod_url                : mod_url,
            mod_issue              : mod_issue,
            mod_group_id           : mod_group_id,
    ]

    inputs.properties properties
    filesMatching(['META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand(properties)
    }

    from(rootProject.file('LICENSE.txt'))
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder  = true

    manifest {
        attributes([
                "Specification-Title"      : mod_name,
                "Specification-Vendor"     : mod_authors,
                "Specification-Version"    : "1",

                "Implementation-Title"     : mod_id,
                "Implementation-Version"   : project.version,
                "Implementation-Vendor"    : mod_authors,
                "Implementation-Timestamp" : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}